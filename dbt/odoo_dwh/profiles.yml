# La variable est definie par docker-compose dans le conteneur Airflow
# (clickhouse_dwh) et absente sur Windows (repli sur localhost).
odoo_dwh:
  target: dev
  outputs:
    dev:
      type: clickhouse
      driver: native
      host: "{{ env_var('CLICKHOUSE_HOST', 'localhost') }}"
      port: 9000
      user: default
      password: ''
      schema: odoo_analytics
      secure: false
      verify: false
      threads: 1
      connect_timeout: 10
      send_receive_timeout: 300
