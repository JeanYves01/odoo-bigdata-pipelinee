# Service auxiliaire pgAdmin, sans modifier le docker-compose.yml principal.
services:
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: "admin@odoo.local"
      PGADMIN_DEFAULT_PASSWORD: "AdminOdoo2026!"
      TZ: "Africa/Abidjan"
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pipeline_net

volumes:
  pgadmin_data:
